[project]
name = "local-agent-p"
version = "0.1.0"
description = "A local-first command-line assistant powered by Ollama and Pydantic AI"
readme = "README.md"
authors = [
    { name = "mohit-dev77", email = "hellomohit777888@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "pydantic-ai>=2.71.0",
]


[project.scripts]
local-agent = "local_agent.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "local_agent"
